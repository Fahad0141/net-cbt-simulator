version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Major versions (for example Capacitor 8, which needs Node 22) need a planned migration, not a bot PR.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ['*']
    open-pull-requests-limit: 2
  # The Windows desktop app's own package (Electron, electron-builder; see docs/DESKTOP.md).
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    cooldown:
      default-days: 7
    groups:
      desktop:
        patterns: ['*']
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
